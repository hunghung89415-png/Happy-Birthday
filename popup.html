<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise 💚</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
}

/* Popup Box */
.popup{
    background:#fff5e6;
    width:400px;
    padding:80px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    position:relative;
}

/* Header style */
.popup h2{
    color:#b30059;
}

/* Buttons */
.buttons a{
    padding:10px 25px;
    border-radius:20px;
    font-weight:bold;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.yes{
    background:#2e7d32;
}

.yes:hover{
    background:#1b5e20;
    transform:scale(1.1);
}

.no{
    background:#ff4d6d;
}

.no:hover{
    background:#cc0052;
    transform:scale(1.1);
}
</style>
</head>

<body>

<div class="popup">
    <h2>Do You Want To See Your Gift? 🎁</h2>

    <div class="buttons">
        <a class="yes" href="CardHidden.html">YES 💚</a>
        <a class="no" href="Why.html">NO 😜</a>
    </div>
</div>

<script>
function goToGift(){
    window.location.href = "Memories.html"; 
}

function moveButton(){
    const button = document.querySelector(".no");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;
    button.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
