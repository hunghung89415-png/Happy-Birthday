<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tada 💚</title>

<style>

/* ===== BODY ===== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    padding: 40px;
}

/* ===== TITLE ===== */
h1 {
    color: white;
    font-size: 40px;
    margin-bottom: 30px;
}

/* ===== MEMORY CARD ===== */
.memory-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

.memory-card {
    background: white;
    width: 250px;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.memory-card:hover {
    transform: scale(1.05);
}

/* ===== IMAGE ===== */
.memory-card img {
    width: 100%;
    border-radius: 15px;
}

/* ===== TEXT ===== */
.memory-card p {
    margin-top: 10px;
    font-weight: bold;
    color: #1b5e20;
}

/* ===== BACK BUTTON ===== */
a {
    display: inline-block;
    margin-top: 40px;
    padding: 10px 20px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    font-weight: bold;
    transition: 0.3s;
}

a:hover {
    background: #1b5e20;
}

</style>
</head>

<body>

<h1>Tada 💚</h1>

<div class="memory-container">

    <div class="memory-card">
        <img src="friends(1).png" alt="Say Cheese">
        <p><a class="back" href="PhotosTogether.html">Photos Together 🌿</a></p>
    </div>

    <div class="memory-card">
        <img src="hello.png" alt="Memory 2">
        <p><a class="back" href="LetterforYou.html">Letter for You ✉️</a></p>
    </div>

    <div class="memory-card">
        <img src="gift-box.png" alt="Memory 3">
        <p><a class="back" href="BestMomentEver.html">Best Moment Ever ✨</a></p>
    </div>

</div>

<a href="popup.html">⬅ Back to Birthday Page</a>

</body>
</html>
